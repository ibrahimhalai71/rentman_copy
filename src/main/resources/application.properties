server.port=9090

spring.datasource.url=jdbc:mysql://localhost:3306/datawan
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100

#prod
twilio.account-sid=test
twilio.auth-token=123
twilio.phone-number=+123
form.client.uri=https://eventico.watisdeplanning.nl/review/client/
form.sp.uri=https://eventico.watisdeplanning.nl/review/service-provider/

spring.mail.host=test
spring.mail.port=123
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=true

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
spring.servlet.multipart.file-size-threshold=25MB
server.tomcat.max-swallow-size=5242880